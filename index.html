<style>
:root{--pri:#4f46e5;--pri-d:#4338ca;--teal:#0d9488;--bg:#f4f5fb;--card:#fff;--text:#1f2430;--muted:#6b7280;--line:#e5e7ef;--danger:#dc2626;--warn:#b45309;--ok:#15803d;--wa:#25d366;--mem:#475569;--radius:14px;--shadow:0 1px 3px rgba(20,20,60,.08),0 4px 14px rgba(20,20,60,.05);--nav-h:62px}
@media (prefers-color-scheme:dark){:root{--bg:#10121a;--card:#1a1d29;--text:#e8eaf2;--muted:#9aa1b5;--line:#2b2f40;--shadow:0 1px 3px rgba(0,0,0,.4)}.avatar{background:#2b3050!important;color:#c7cbff!important}.chip{background:#252a3d!important}input.inp,select.inp,textarea.inp{background:#12141d!important;color:var(--text)!important}.btn{background:#232738;color:var(--text)}.btn.ghost{background:transparent}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--text);line-height:1.45;font-size:16px}
body.modal-open{overflow:hidden}
body.locked .topbar,body.locked .nav,body.locked main{display:none}
a{color:var(--pri);text-decoration:none}a:hover{text-decoration:underline}
h1{font-size:1.45rem;margin:.1em 0}h2{font-size:1.1rem;margin:0 0 .6em}h3{font-size:1rem;margin:.9em 0 .4em}
p{margin:.4em 0}
.muted{color:var(--muted)}.small{font-size:.86rem}.bad{color:var(--danger)}.warnc{color:var(--warn)}.center{text-align:center}
[hidden]{display:none!important}

/* layout */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top));background:linear-gradient(90deg,var(--pri),var(--teal));color:#fff}
.brand{display:flex;align-items:center;gap:9px;color:#fff;font-weight:700;font-size:1.05rem}.brand:hover{text-decoration:none}.brand img{border-radius:8px}
.top-actions{display:flex;gap:8px;align-items:center}
.topbar .icon-btn{color:#fff;background:rgba(255,255,255,.18)}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;overflow-x:auto;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);scrollbar-width:none;box-shadow:0 -2px 10px rgba(0,0,0,.06)}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:1 0 auto;min-width:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:7px 4px;color:var(--muted);font-size:.7rem;gap:1px}
.nav a span{font-size:1.3rem;line-height:1.1}.nav a b{font-weight:600}.nav a:hover{text-decoration:none}
.nav a.on{color:var(--pri)}.nav a.on span{transform:scale(1.12)}
main{padding:14px 14px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom));max-width:1100px;margin:0 auto}
@media(min-width:900px){
 .nav{top:56px;bottom:0;right:auto;width:200px;flex-direction:column;overflow:visible;border-top:0;border-right:1px solid var(--line);padding:10px 8px;box-shadow:none}
 .nav a{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 14px;border-radius:10px;font-size:.95rem}
 .nav a.on{background:rgba(79,70,229,.1)}
 main{margin-left:210px;max-width:none;padding:22px 28px 40px}
 main>*{max-width:1000px}
}
.loading{padding:40px;text-align:center;color:var(--muted)}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.memory-head{background:linear-gradient(135deg,#334155,#64748b);color:#fff;border-radius:var(--radius);padding:16px}.memory-head .muted{color:#dbe2ec}

/* cards, buttons, inputs */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin:0 0 14px}
.card.note{background:#fff7e0;color:#5b4300;border:1px solid #f3d57a}
@media (prefers-color-scheme:dark){.card.note{background:#3a3115;color:#f6e3a1;border-color:#6b5a1a}}
.card.welcome{background:linear-gradient(135deg,rgba(79,70,229,.1),rgba(13,148,136,.1))}
.danger-zone{border:1px solid #fecaca}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text);font:inherit;font-weight:600;cursor:pointer;min-height:42px;text-decoration:none!important;transition:filter .15s,transform .05s}
.btn:hover{filter:brightness(.97)}.btn:active{transform:scale(.98)}.btn[disabled]{opacity:.5;pointer-events:none}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#073b1d}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger-o{color:var(--danger);border-color:#fca5a5;background:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;min-height:34px;font-size:.88rem}.btn.xs{padding:3px 8px;min-height:26px;font-size:.78rem}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}.btn-row.center{justify-content:center}.btn-row.main{margin-top:12px}
.icon-btn{border:0;background:rgba(0,0,0,.06);border-radius:50%;width:36px;height:36px;font-size:1rem;cursor:pointer;color:inherit}
.inp{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--text)}
.inp:focus,.btn:focus-visible,a:focus-visible{outline:3px solid rgba(79,70,229,.35);outline-offset:1px}
textarea.inp{resize:vertical;min-height:60px}
.sm-sel{width:auto;max-width:100%;padding:6px 10px}
label{display:block;font-size:.85rem;font-weight:600;color:var(--muted)}label .inp,label select{margin-top:4px;font-weight:400}
label.chk{display:flex;gap:8px;align-items:flex-start;color:var(--text);font-weight:400;font-size:.92rem}label.chk input{margin-top:3px}
.lbl{font-size:.85rem;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:8px 0}
.fgrid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fgrid2 .span2{grid-column:1/-1}
@media(max-width:600px){.fgrid2{grid-template-columns:1fr}}
.row2{display:flex;gap:8px;align-items:flex-end}.row2>label{flex:1}.row2 .btn{flex:none}
.form label{margin-bottom:2px}
.static{margin-top:4px;padding:10px 12px;background:var(--bg);border-radius:10px;font-weight:400;color:var(--text)}
.hint{font-size:.82rem;color:var(--muted);margin:8px 0}
.errbox{background:#fef2f2;color:#991b1b;border:1px solid #fecaca;border-radius:10px;padding:10px 12px;margin:10px 0}
.warn{background:#fffbeb;color:#92400e;border:1px solid #fde68a;border-radius:10px;padding:8px 10px;margin:8px 0;font-size:.88rem}

/* segmented + tabs */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}.seg.wide{display:flex;margin:8px 0}
.seg button,.seg label{flex:1;white-space:nowrap;border:0;background:transparent;padding:8px 14px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;text-align:center;margin:0}
.seg .on{background:var(--pri);color:#fff}.seg input{display:none}
.tabs{display:flex;gap:6px;margin-bottom:10px;border-bottom:2px solid var(--line)}
.tabs button{border:0;background:none;padding:9px 14px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--pri);border-color:var(--pri)}
.head-row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

/* dashboard */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;color:inherit}
.stat:hover{text-decoration:none}.stat span{grid-row:1/3;font-size:1.7rem}.stat b{font-size:1.6rem;line-height:1}.stat small{color:var(--muted);font-size:.78rem}
.stat.hi{background:linear-gradient(135deg,#fef3c7,#fde68a);color:#4a3200}.stat.hi small{color:#6b5300}
.stat.hi2{background:linear-gradient(135deg,#e2e8f0,#cbd5e1);color:#1e293b}.stat.hi2 small{color:#475569}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:800px){.cols2{grid-template-columns:1fr}}
.mini{display:flex;align-items:center;gap:10px;padding:6px 0;color:inherit;border-bottom:1px solid var(--line)}.mini:last-child{border:0}

/* occasion cards */
.occ{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.occ:last-child{border:0}
.occ-main{flex:1;min-width:200px}.occ-title{font-weight:700}.occ-title a{color:inherit}.occ-sub{font-size:.88rem;color:var(--muted)}
.occ.death_anniv,.occ.birth_anniv{border-left:4px solid #94a3b8;padding-left:10px}
.occ-actions{display:flex;flex-direction:column;gap:6px;align-items:stretch}@media(max-width:600px){.occ-actions{flex-direction:row;flex-wrap:wrap;width:100%}}
.avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#e0e7ff;color:var(--pri);display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.avatar.sm{width:36px;height:36px;font-size:.85rem}.avatar.xl{width:96px;height:96px;font-size:1.6rem}.avatar.mem{filter:grayscale(.55);border:2px solid #cbd5e1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{display:inline-block;background:#eef0f7;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:600}
.chip.st-prepared{background:#e0e7ff;color:#3730a3}.chip.st-copied{background:#fef3c7;color:#92400e}.chip.st-opened{background:#ffedd5;color:#9a3412}.chip.st-confirmed{background:#dcfce7;color:#166534}.chip.st-skipped{background:#e5e7eb;color:#4b5563}
.tag{font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:6px;text-transform:uppercase;letter-spacing:.03em;vertical-align:middle}
.tag.living{background:#dcfce7;color:#166534}.tag.deceased{background:#e2e8f0;color:#334155}.tag.demo{background:#fef08a;color:#713f12}
.empty{text-align:center;padding:22px 10px;color:var(--muted)}.empty .big{font-size:2.2rem}

/* members */
.fgrid label{font-size:.78rem}
.mrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.mrow:last-child{border:0}
.mrow-main{flex:1;min-width:0}.mname{font-weight:700;color:inherit}.mrow-act{display:flex;gap:6px;flex:none}
#mlist{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:4px 14px}
.filters{padding:12px}.filters .fgrid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.profile{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.profile.deceased{background:linear-gradient(135deg,#f1f5f9,#e2e8f0);color:#1e293b}
.kv{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}.kv span{width:130px;flex:none;color:var(--muted);font-size:.88rem}.kv div{flex:1;word-break:break-word}
.mem-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:14px}
.mem-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;text-align:center;border-top:4px solid #94a3b8}.mem-card h3{margin:.5em 0 .1em}
.mem-card .avatar{margin:auto}.nx{list-style:none;padding:0;margin:.5em 0;text-align:left}.nx li{padding:3px 0}

/* form */
.photo-row{display:flex;gap:14px;align-items:center;margin:10px 0}
.gchips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}.gchip{display:inline-flex!important;gap:6px;align-items:center;background:#eef0f7;border-radius:999px;padding:5px 12px;color:var(--text)!important;font-weight:500!important;cursor:pointer}
.dec-box{background:#f1f5f9;border-radius:var(--radius);padding:12px;margin:12px 0;color:#1e293b}.dec-box label{color:#475569}.dec-box .inp{background:#fff;color:#1f2430}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}.tbl th,.tbl td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}.tbl th{color:var(--muted);font-size:.78rem;text-transform:uppercase}
.tbl-wrap{overflow:auto;max-height:60vh;border:1px solid var(--line);border-radius:10px;margin:8px 0}
.tbl.imp input,.tbl.imp select{width:100%;min-width:90px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:.85rem;background:transparent;color:inherit}
.tbl.imp td:first-child input{width:auto;min-width:0}.tbl.imp .iss{min-width:200px;font-size:.8rem}
.tbl.imp tr.bad{background:rgba(220,38,38,.07)}.tbl.imp tr.dup{background:rgba(245,158,11,.1)}
.sum{background:var(--bg);padding:8px 12px;border-radius:10px;margin:8px 0}
.dq-item{padding:5px 0;border-bottom:1px dashed var(--line);font-size:.9rem}
.grow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);gap:8px;flex-wrap:wrap}

/* calendar */
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.month{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px;break-inside:avoid}.month h3{margin:0 0 6px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:.72rem}.mgrid b{color:var(--muted);font-weight:600}.mgrid i{font-style:normal;padding:3px 0;border-radius:6px}
.mgrid i.has{background:var(--pri);color:#fff;font-weight:700}.mgrid i.today{outline:2px solid var(--teal)}
.month ul{list-style:none;padding:0;margin:8px 0 0;font-size:.85rem}.month li{padding:2px 0}.month li b{display:inline-block;width:1.6em}
.yr{font-size:1.1rem;padding:0 6px}

/* messages */
.tpl{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}
pre{white-space:pre-wrap;word-wrap:break-word;font:inherit;margin:0 0 6px}
textarea.msg{font-size:.98rem;line-height:1.5}
.events{list-style:none;padding:0;margin:6px 0 0;font-size:.8rem;color:var(--muted)}.status-box{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}

/* modal */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(15,18,30,.55);display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;box-shadow:0 -6px 40px rgba(0,0,0,.3);animation:up .18s ease-out}
.modal.wide{max-width:680px}
@media(min-width:700px){.overlay{align-items:center;padding:20px}.modal{border-radius:18px}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 4px;position:sticky;top:0;background:var(--card);z-index:1}.modal-head h3{margin:0;font-size:1.05rem}
.modal-body{padding:8px 16px 14px}.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:10px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--card)}
#toast{position:fixed;left:0;right:0;top:calc(62px + env(safe-area-inset-top));z-index:200;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
@media(min-width:900px){#toast{left:210px}}
.toast-item{background:#1f2430;color:#fff;padding:10px 16px;border-radius:12px;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.3);font-size:.92rem;transition:opacity .4s}.toast-item.out{opacity:0}
.toast-item.err{background:#b91c1c}.toast-item.ok{background:#15803d}

/* lock */
.lock{position:fixed;inset:0;z-index:300;background:linear-gradient(135deg,var(--pri),var(--teal));display:flex;align-items:center;justify-content:center;padding:20px}
.lock-box{background:var(--card);border-radius:20px;padding:28px 24px;width:100%;max-width:340px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.lock-box img{border-radius:16px}.lock-box h1{margin:.2em 0 0}.lock-box p{color:var(--muted);margin:0}.lock-box .inp{text-align:center;font-size:1.2rem;letter-spacing:.2em}.lock-box .btn{width:100%}

@media print{.topbar,.nav,.noprint,#toast,.btn{display:none!important}main{margin:0;padding:0}body{background:#fff}.month{box-shadow:none;border:1px solid #ccc}}

.tblwrap{overflow-x:auto}.tblwrap .tbl td,.tblwrap .tbl th{vertical-align:top}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:0 0 12px}.quick .btn{min-height:48px}@media(min-width:700px){.quick{grid-template-columns:repeat(4,1fr)}}
@media(pointer:coarse){.btn.sm{min-height:40px}.btn.xs{min-height:34px}}
.faq{padding:0}.faq summary{padding:14px 16px;cursor:pointer;list-style:none}.faq summary::-webkit-details-marker{display:none}.faq summary::before{content:'▸ ';color:var(--pri)}.faq[open] summary::before{content:'▾ '}.faq-a{padding:0 16px 14px;font-size:.95rem}.faq-a ol,.faq-a ul{padding-left:20px}code{background:var(--bg);padding:1px 5px;border-radius:5px;font-size:.88em}

</style>
</head>

<noscript><p style="padding:20px">Group Connect needs JavaScript. Please enable it.</p></noscript>

<script>
/* ==== core.js ==== */
/* Group Connect – core logic (shared by the page and the service worker).
   No DOM access here. */
(function (root) {
  'use strict';
  const GC = root.GC || (root.GC = {});
  GC.VERSION = '1.2.0';      // keep in step with CACHE in service-worker.js (group-connect-v<VERSION>)
  GC.BG_SYNC = false;         // true only when the service worker can run reminders itself (multi-file build); the single-file build sets false

  /* ---------- tiny helpers ---------- */
  const pad = n => String(n).padStart(2, '0');
  GC.pad = pad;
  GC.uid = () => (root.crypto && crypto.randomUUID) ? crypto.randomUUID()
    : 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  GC.ordinal = n => {
    const v = n % 100, s = ['th', 'st', 'nd', 'rd'];
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  };
  GC.isLeap = y => (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
  const dim = (y, m) => [31, GC.isLeap(y) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1];
  GC.daysInMonth = dim;
  GC.MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

  /* ---------- IndexedDB ---------- */
  const DB_NAME = 'GroupConnectDB', DB_VER = 1;
  const STORES = { members: 'id', settings: 'key', messageLog: 'id', reminderHistory: 'key', customMessages: 'id' };
  GC.STORES = Object.keys(STORES);
  let _db = null;
  GC.openDB = function () {
    if (_db) return Promise.resolve(_db);
    return new Promise((res, rej) => {
      const r = indexedDB.open(DB_NAME, DB_VER);
      r.onupgradeneeded = () => {
        const db = r.result;
        for (const [s, k] of Object.entries(STORES))
          if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: k });
      };
      r.onsuccess = () => { _db = r.result; _db.onversionchange = () => { _db.close(); _db = null; }; res(_db); };
      r.onerror = () => rej(r.error);
      r.onblocked = () => rej(new Error('Database blocked – close other tabs of this app.'));
    });
  };
  function run(store, mode, fn) {
    return GC.openDB().then(db => new Promise((res, rej) => {
      const t = db.transaction(store, mode);
      const r = fn(t.objectStore(store));
      t.oncomplete = () => res(r && r.result);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error || new Error('Transaction aborted'));
    }));
  }
  GC.db = {
    all: s => run(s, 'readonly', o => o.getAll()),
    get: (s, k) => run(s, 'readonly', o => o.get(k)),
    put: (s, v) => run(s, 'readwrite', o => o.put(v)),
    del: (s, k) => run(s, 'readwrite', o => o.delete(k)),
    clear: s => run(s, 'readwrite', o => o.clear()),
    putMany: (s, arr) => GC.openDB().then(db => new Promise((res, rej) => {
      const t = db.transaction(s, 'readwrite'); const o = t.objectStore(s);
      arr.forEach(v => o.put(v));
      t.oncomplete = () => res(arr.length); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    })),
    /* All-or-nothing write across several stores: if anything fails the whole transaction rolls back. */
    atomic: (clearStores, puts) => GC.openDB().then(db => new Promise((res, rej) => {
      const names = [...new Set([...clearStores, ...Object.keys(puts)])]; const t = db.transaction(names, 'readwrite');
      try { clearStores.forEach(s => t.objectStore(s).clear()); for (const [s, arr] of Object.entries(puts)) arr.forEach(v => t.objectStore(s).put(v)); } catch (e) { try { t.abort(); } catch (x) {} return rej(e); }
      t.oncomplete = () => res(true); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('Restore cancelled – nothing was changed.'));
    })),
    delMany: (s, keys) => GC.openDB().then(db => new Promise((res, rej) => {
      const t = db.transaction(s, 'readwrite'); const o = t.objectStore(s);
      keys.forEach(k => o.delete(k));
      t.oncomplete = () => res(keys.length); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    }))
  };

  /* ---------- settings ---------- */
  GC.DEFAULTS = {
    tz: 'Asia/Kolkata', defaultCC: '+91', adminName: '',
    reminderTime: '05:00', notifEnabled: false, advanceEnabled: true, advanceDays: [1],
    weeklyEnabled: true, weeklyDay: 1, hideNames: false,
    preferredGroup: '', groups: [], autoLockMin: 5, remTone: 'respectful',
    pinHash: '', pinSalt: '', demoLoaded: false, tplOverrides: {}
  };
  GC.getSettings = async function () {
    const rows = await GC.db.all('settings');
    const s = Object.assign({}, GC.DEFAULTS);
    rows.forEach(r => { s[r.key] = r.value; });
    return s;
  };
  GC.setSetting = (key, value) => GC.db.put('settings', { key, value });
  GC.setSettings = obj => GC.db.putMany('settings', Object.entries(obj).map(([key, value]) => ({ key, value })));

  /* ---------- dates ---------- */
  GC.nowParts = function (tz, now) {
    now = now || new Date();
    const dow = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
    let f;
    try {
      f = new Intl.DateTimeFormat('en-CA', { timeZone: tz || 'Asia/Kolkata', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false, weekday: 'short' });
    } catch (e) {
      f = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Kolkata', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false, weekday: 'short' });
    }
    const p = {};
    f.formatToParts(now).forEach(x => { p[x.type] = x.value; });
    const h = p.hour === '24' ? '00' : p.hour;
    return { date: `${p.year}-${p.month}-${p.day}`, time: `${h}:${p.minute}`, hour: +h, minute: +p.minute, dow: dow[p.weekday] };
  };
  GC.parseISO = function (s) {
    if (!s || typeof s !== 'string') return null;
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s.trim());
    if (!m) return null;
    const y = +m[1], mo = +m[2], d = +m[3];
    const hasYear = y > 0, yy = hasYear ? y : 2000;
    if (mo < 1 || mo > 12 || d < 1 || d > dim(yy, mo)) return null;
    return { y, m: mo, d, hasYear };
  };
  GC.toISO = (y, m, d) => `${String(y).padStart(4, '0')}-${pad(m)}-${pad(d)}`;
  const MON = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, sept: 9, oct: 10, nov: 11, dec: 12 };
  /* Accepts many human formats (day-first, as used in India). Returns ISO string, '' if empty, null if unreadable. */
  GC.parseFlexible = function (input) {
    if (input == null) return '';
    if (input instanceof Date) return GC.toISO(input.getFullYear(), input.getMonth() + 1, input.getDate());
    let s = String(input).trim();
    if (!s) return '';
    const okISO = (y, m, d) => { const r = GC.toISO(y, m, d); return GC.parseISO(r) ? r : null; };
    let m;
    if ((m = /^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})(?:[T\s].*)?$/.exec(s))) return okISO(+m[1], +m[2], +m[3]);
    if ((m = /^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/.exec(s))) return okISO(+m[3], +m[2], +m[1]);
    if ((m = /^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2})$/.exec(s))) {
      const cur = new Date().getFullYear() % 100; const yy = +m[3];
      return okISO(yy > cur ? 1900 + yy : 2000 + yy, +m[2], +m[1]);
    }
    if ((m = /^(\d{1,2})[-\/.](\d{1,2})$/.exec(s))) return okISO(0, +m[2], +m[1]);
    if ((m = /^(\d{1,2})(?:st|nd|rd|th)?[\s\-\/.,]+([A-Za-z]{3,9})\.?[\s\-\/.,]*(\d{4})?$/.exec(s))) {
      const mo = MON[m[2].slice(0, 4).toLowerCase()] || MON[m[2].slice(0, 3).toLowerCase()];
      if (mo) return okISO(m[3] ? +m[3] : 0, mo, +m[1]);
    }
    if ((m = /^([A-Za-z]{3,9})\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s*(\d{4})?$/.exec(s))) {
      const mo = MON[m[1].slice(0, 4).toLowerCase()] || MON[m[1].slice(0, 3).toLowerCase()];
      if (mo) return okISO(m[3] ? +m[3] : 0, mo, +m[2]);
    }
    if (/^\d{1,6}(\.\d+)?$/.test(s)) {            // Excel serial date
      const n = Math.floor(+s);
      if (n >= 1 && n < 80000) { const dt = new Date(Date.UTC(1899, 11, 30) + n * 864e5); return okISO(dt.getUTCFullYear(), dt.getUTCMonth() + 1, dt.getUTCDate()); }
    }
    return null;
  };
  GC.fmtDate = function (iso, opts) {          // 15 Aug 1975  /  15 Aug
    const p = GC.parseISO(iso); if (!p) return '';
    const mon = GC.MONTHS[p.m - 1].slice(0, 3);
    return p.hasYear && !(opts && opts.noYear) ? `${p.d} ${mon} ${p.y}` : `${p.d} ${mon}`;
  };
  GC.addDays = function (iso, n) {
    const p = GC.parseISO(iso); const t = new Date(Date.UTC(p.y, p.m - 1, p.d) + n * 864e5);
    return GC.toISO(t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate());
  };
  GC.daysBetween = function (a, b) {
    const x = GC.parseISO(a), y = GC.parseISO(b);
    return Math.round((Date.UTC(y.y, y.m - 1, y.d) - Date.UTC(x.y, x.m - 1, x.d)) / 864e5);
  };
  /* 29 Feb is observed on 28 Feb in non-leap years. */
  GC.occInYear = (m, d, y) => (m === 2 && d === 29 && !GC.isLeap(y)) ? { m: 2, d: 28, adjusted: true } : { m, d, adjusted: false };
  GC.nextOcc = function (m, d, todayISO) {
    let y = GC.parseISO(todayISO).y;
    let o = GC.occInYear(m, d, y), s = GC.toISO(y, o.m, o.d);
    if (s < todayISO) { y++; o = GC.occInYear(m, d, y); s = GC.toISO(y, o.m, o.d); }
    return { date: s, year: y, adjusted: o.adjusted };
  };

  /* ---------- phone numbers ---------- */
  GC.normPhone = function (raw, cc) {
    cc = (cc || '+91').replace(/[^\d]/g, '');
    if (raw == null || String(raw).trim() === '') return { ok: false, empty: true, value: '' };
    let s = String(raw).trim().replace(/[\s\-().]/g, '');
    if (s.startsWith('00')) s = '+' + s.slice(2);
    let digits;
    if (s.startsWith('+')) digits = s.slice(1);
    else {
      digits = s;
      if (digits.length === 10) digits = cc + digits;
      else if (digits.length === 11 && digits[0] === '0') digits = cc + digits.slice(1);
      else if (digits.length === 12 && digits.startsWith(cc)) { /* already has country code */ }
      else if (digits.length < 10) return { ok: false, value: String(raw).trim() };
    }
    if (!/^\d+$/.test(digits) || digits.length < 8 || digits.length > 15) return { ok: false, value: String(raw).trim() };
    return { ok: true, value: '+' + digits };
  };
  GC.waDigits = m => ((m.whatsapp || m.mobile || '') + '').replace(/\D/g, '');

  /* ---------- member model ---------- */
  GC.blankMember = () => ({
    id: GC.uid(), name: '', title: '', gender: '', mobile: '', whatsapp: '', dob: '', email: '', address: '',
    profession: '', groups: [], intro: '', photo: '', status: 'living', dod: '', remarks: '',
    familyName: '', familyContact: '', bio: '', showPhone: false, demo: false,
    createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
  });
  GC.firstName = m => (m.name || '').trim().split(/\s+/)[0] || '';
  GC.initials = m => (m.name || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase();
  GC.honorific = function (m) {
    const t = (m.title || '').trim();
    if (m.status === 'deceased') {
      if (m.gender === 'F' && (!t || /^(mrs?|ms|miss|smt)\.?$/i.test(t))) return 'Late Smt.';
      if (!t || /^(mr|shri|sri|shree)\.?$/i.test(t)) return m.gender === 'F' ? 'Late Smt.' : (m.gender === 'M' || t) ? 'Late Shri' : 'Late';
      if (/^(mrs?|ms|miss|smt)\.?$/i.test(t)) return 'Late Smt.';
      return 'Late ' + t;
    }
    if (t) return t;
    return m.gender === 'M' ? 'Mr.' : m.gender === 'F' ? 'Ms.' : '';
  };
  GC.nameH = m => (GC.honorific(m) + ' ' + (m.name || '')).trim();
  GC.pron = function (m) {
    if (m.gender === 'M') return { he: 'he', him: 'him', his: 'his' };
    if (m.gender === 'F') return { he: 'she', him: 'her', his: 'her' };
    return { he: 'they', him: 'them', his: 'their' };
  };
  /* A deceased member's number is shown only when the admin has expressly authorised it. */
  GC.phoneVisible = m => m.status !== 'deceased' || !!m.showPhone;

  GC.validateMember = function (m, ctx) {
    ctx = ctx || {}; const errors = [], warnings = [];
    const today = ctx.today || GC.nowParts('Asia/Kolkata').date; const ty = +today.slice(0, 4);
    if (!(m.name || '').trim()) errors.push('Name is required');
    const dob = m.dob ? GC.parseISO(m.dob) : null;
    const dod = m.dod ? GC.parseISO(m.dod) : null;
    if (m.dob && !dob) errors.push('Date of birth is invalid');
    if (m.dod && !dod) errors.push('Date of death is invalid');
    if (m.status === 'living') {
      if (!m.dob) errors.push('Date of birth is missing');
      if (m.dod) warnings.push('Date of death entered for a living member – ignored');
    } else {
      if (!m.dob && !m.dod) errors.push('Enter at least a date of birth or date of death');
      if (!m.dod) warnings.push('No date of death – death anniversary will not be tracked');
      if (!m.dob) warnings.push('No date of birth – birth anniversary will not be tracked');
    }
    if (dob && dob.hasYear) {
      if (dob.y < 1900) errors.push('Birth year looks wrong (before 1900)');
      if (m.dob > today) errors.push('Date of birth is in the future');
    }
    if (dod && dod.hasYear) {
      if (m.dod > today) errors.push('Date of death is in the future');
      if (dod.y < 1900) errors.push('Death year looks wrong');
      if (dob && dob.hasYear && m.dod < m.dob) errors.push('Date of death is before date of birth');
    }
    if (m.mobile) { const p = GC.normPhone(m.mobile, ctx.cc); if (!p.ok) errors.push('Mobile number is invalid'); }
    else if (m.status === 'living') warnings.push('No mobile number – WhatsApp buttons will be unavailable');
    if (m.whatsapp) { const p = GC.normPhone(m.whatsapp, ctx.cc); if (!p.ok) errors.push('WhatsApp number is invalid'); }
    if (m.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m.email)) warnings.push('Email looks invalid');
    return { errors, warnings };
  };

  /* ---------- occasions ---------- */
  GC.OCC = {
    birthday: { label: 'Birthday', icon: '🎂' },
    birth_anniv: { label: 'Birth anniversary', icon: '🕊️' },
    death_anniv: { label: 'Death anniversary', icon: '🕯️' }
  };
  GC.occasionsOf = function (m) {
    const out = [];
    const dob = m.dob ? GC.parseISO(m.dob) : null, dod = m.dod ? GC.parseISO(m.dod) : null;
    if (m.status === 'deceased') {
      if (dob) out.push({ type: 'birth_anniv', m: dob.m, d: dob.d, srcYear: dob.hasYear ? dob.y : null });
      if (dod) out.push({ type: 'death_anniv', m: dod.m, d: dod.d, srcYear: dod.hasYear ? dod.y : null });
    } else if (dob) out.push({ type: 'birthday', m: dob.m, d: dob.d, srcYear: dob.hasYear ? dob.y : null });
    return out;
  };
  /* All occasions falling within [from, from+days]; years = age completing / years since. */
  GC.upcoming = function (members, fromISO, days) {
    const out = [];
    for (const mem of members) {
      for (const o of GC.occasionsOf(mem)) {
        const n = GC.nextOcc(o.m, o.d, fromISO);
        const inDays = GC.daysBetween(fromISO, n.date);
        if (inDays > days) continue;
        let years = o.srcYear ? n.year - o.srcYear : null;
        if (years !== null && years <= 0) years = null;
        out.push({ member: mem, type: o.type, date: n.date, inDays, years, adjusted: n.adjusted, key: `${mem.id}|${o.type}|${n.date}` });
      }
    }
    out.sort((a, b) => a.date.localeCompare(b.date) || (a.member.name || '').localeCompare(b.member.name || ''));
    return out;
  };

  /* ---------- message log (prepared → copied → opened → confirmed) ---------- */
  GC.STATUS_RANK = { prepared: 1, copied: 2, opened: 3, confirmed: 4 };
  GC.logId = (memberId, occasion, occDate, channel, group) => [memberId, occasion, occDate, channel, group || ''].join('|');
  GC.logMessage = async function (info, status, text) {
    const id = GC.logId(info.memberId, info.occasion, info.occDate, info.channel, info.group);
    const now = new Date().toISOString();
    let row = await GC.db.get('messageLog', id);
    if (!row) row = Object.assign({ id, status: 'prepared', events: [], text: '' }, info);
    if (text != null) row.text = text;
    if (status === 'skipped') row.status = 'skipped';
    else if ((GC.STATUS_RANK[status] || 0) > (GC.STATUS_RANK[row.status] || 0) || row.status === 'skipped') row.status = status;
    if (!row.events.some(e => e.status === status) || status === 'opened' || status === 'copied') row.events.push({ status, at: now });
    row.updatedAt = now;
    await GC.db.put('messageLog', row);
    return row;
  };

  /* ---------- reminders ---------- */
  function occLine(o) {
    const m = o.member, nm = GC.nameH(m);
    if (o.type === 'birthday') return `🎂 ${nm}${o.years ? ' (turns ' + o.years + ')' : ''}`;
    if (o.type === 'birth_anniv') return `🕊️ ${nm} – birth anniversary${o.years ? ' (' + GC.ordinal(o.years) + ')' : ''}`;
    return `🕯️ ${nm} – death anniversary${o.years ? ' (' + GC.ordinal(o.years) + ')' : ''}`;
  }
  GC.occLine = occLine;
  function summarise(list, hide) {
    const b = list.filter(o => o.type === 'birthday').length, r = list.length - b;
    const parts = [];
    if (b) parts.push(b + (b > 1 ? ' birthdays' : ' birthday'));
    if (r) parts.push(r + (r > 1 ? ' remembrances' : ' remembrance'));
    return hide ? parts.join(' and ') + ' – open Group Connect for details' : list.map(occLine).join('\n');
  }
  /* Runs the reminder check. `notify(title, body, tag)` must return true when actually shown. */
  GC.runReminders = async function (opts) {
    opts = opts || {};
    const S = await GC.getSettings();
    if (!S.notifEnabled && !opts.force) return { skipped: 'disabled', shown: 0 };
    const now = GC.nowParts(S.tz);
    const [rh, rm] = (S.reminderTime || '05:00').split(':').map(Number);
    if (!opts.force && now.hour * 60 + now.minute < rh * 60 + rm) return { skipped: 'before-time', shown: 0 };
    const members = await GC.db.all('members');
    const done = new Set((await GC.db.all('reminderHistory')).map(h => h.key));
    const groups = [];
    const today = GC.upcoming(members, now.date, 0).map(o => Object.assign(o, { kind: 'today' }));
    groups.push({ kind: 'today', list: today.filter(o => !done.has(o.key + '|today')), title: t => `Today: ${t}` });
    if (S.advanceEnabled) {
      for (const n of [...new Set((S.advanceDays && S.advanceDays.length ? S.advanceDays : [1]).map(Number))].filter(n => n >= 1 && n <= 30).sort((a, b) => a - b)) {
        const kind = n === 1 ? 'advance' : 'advance' + n;   // 'advance' keeps the key used by earlier versions
        const l = GC.upcoming(members, GC.addDays(now.date, n), 0).map(o => Object.assign(o, { kind }));
        groups.push({ kind, days: n, list: l.filter(o => !done.has(o.key + '|' + kind)), title: t => `In ${n} day${n === 1 ? '' : 's'}: ${t}` });
      }
    }
    let weekly = null;
    if (S.weeklyEnabled && now.dow === +S.weeklyDay && !done.has('weekly|' + now.date)) {
      const l = GC.upcoming(members, GC.addDays(now.date, 1), 6).map(o => Object.assign(o, { kind: 'weekly' }));
      weekly = l;
    }
    let shown = 0; const stamp = new Date().toISOString();
    for (const g of groups) {
      if (!g.list.length) continue;
      const body = summarise(g.list, S.hideNames);
      const head = g.kind === 'today' ? 'Group Connect – today' : g.days === 1 ? 'Group Connect – tomorrow' : `Group Connect – in ${g.days} days`;
      const ok = opts.notify ? await opts.notify(head, body, 'gc-' + g.kind + '-' + now.date) : false;
      if (ok) {
        shown++;
        await GC.db.putMany('reminderHistory', g.list.map(o => ({
          key: o.key + '|' + g.kind, kind: g.kind, memberId: o.member.id, name: GC.nameH(o.member),
          type: o.type, occDate: o.date, notifiedAt: stamp
        })));
      }
    }
    if (weekly) {
      const body = weekly.length ? summarise(weekly, S.hideNames).replace(/^/, S.hideNames ? '' : '') : 'No birthdays or remembrances in the next 7 days.';
      const ok = opts.notify ? await opts.notify('Group Connect – week ahead', weekly.length && !S.hideNames ? weekly.map(o => GC.fmtDate(o.date, { noYear: true }) + '  ' + occLine(o).replace(/^\S+\s/, '')).join('\n') : body, 'gc-weekly-' + now.date) : false;

  const F = { q: '', status: '', group: '', month: '', dob: '', dod: '', dmonth: '', prof: '' };
  function filterMembers(members) {
    const q = F.q.trim().toLowerCase(), qd = q.replace(/\D/g, '');
    return members.filter(m => {
      if (F.status && m.status !== F.status) return false;
      if (F.group && !(m.groups || []).includes(F.group)) return false;
      if (F.month) { const d = GC.parseISO(m.dob); if (!d || d.m !== +F.month) return false; }
      if (F.dob && m.dob !== F.dob) { const d = GC.parseISO(m.dob); if (!(d && !d.hasYear && m.dob.slice(5) === F.dob.slice(5))) return false; }
      if (F.dmonth) { const d = GC.parseISO(m.dod); if (!d || d.m !== +F.dmonth) return false; }
      if (F.prof && (m.profession || '').trim().toLowerCase() !== F.prof.toLowerCase()) return false;
      if (F.dod && m.dod !== F.dod) return false;
      if (q) {
        const hay = ((m.name || '') + ' ' + (m.title || '') + ' ' + (m.profession || '') + ' ' + (m.groups || []).join(' ')).toLowerCase();
        const ph = ((m.mobile || '') + (m.whatsapp || '')).replace(/\D/g, '');
        if (!(hay.includes(q) || (qd.length >= 3 && ph.includes(qd)))) return false;
      }
      return true;
    }).sort((a, b) => (a.name || '').localeCompare(b.name || ''));
  }

  let IMP = null;
  function findDup(i, S, existing) {
    const row = IMP.rows[i], mob = row.res.member.mobile;
    if (!mob || !GC.normPhone(mob, S.defaultCC).ok) return null;
    const ex = existing.find(m => m.mobile === mob); if (ex) return { name: ex.name, where: 'database', id: ex.id };
    for (let j = 0; j < i; j++) if (IMP.rows[j].res.member.mobile === mob) return { name: IMP.rows[j].res.member.name || 'row ' + (j + 1), where: 'file' };
    return null;
  }
  function revalidate(i, S, existing, today) { const r = IMP.rows[i]; r.res = GC.recordToMember(r.f, S, today); r.dup = findDup(i, S, existing); }
  function importRowHTML(r, i) {
    const bad = r.res.errors.length, m = r.res.member;
    return `<tr data-i="${i}" class="${bad ? 'bad' : r.dup ? 'dup' : ''}">
      <td><input type="checkbox" data-inc ${r.inc ? 'checked' : ''}></td><td>${i + 1}</td>
      <td><input data-f="name" value="${esc(r.f.name)}"></td><td><input data-f="mobile" value="${esc(r.f.mobile)}"></td>
      <td><input data-f="dob" value="${esc(r.f.dob)}" placeholder="DD-MM-YYYY"></td>
      <td><select data-f="status"><option value="Living" ${m.status === 'living' ? 'selected' : ''}>Living</option><option value="Deceased" ${m.status === 'deceased' ? 'selected' : ''}>Deceased</option></select></td>
      <td><input data-f="dod" value="${esc(r.f.dod)}" placeholder="DD-MM-YYYY"></td><td><input data-f="groups" value="${esc(r.f.groups)}"></td>
      <td class="iss">${issues(r)}</td></tr>`;
  }
  const issues = r => r.res.errors.map(e => `<span class="bad">✖ ${esc(e)}</span>`).join('<br>') +
    (r.dup ? `<br><span class="warnc">⚠ Duplicate mobile of ${esc(r.dup.name)} (${r.dup.where})</span>` : '') +
    (r.res.errors.length ? '' : r.res.warnings.map(w => `<br><span class="muted">ℹ ${esc(w)}</span>`).join(''));
  function importSummary(el) {
    const rows = IMP.rows; const err = rows.filter(r => r.res.errors.length).length, dup = rows.filter(r => r.dup).length;
    const ok = rows.filter(r => r.inc && !r.res.errors.length && !(r.dup && IMP.mode === 'skip')).length;
    el.querySelector('#imp-sum').innerHTML = `<b>${rows.length}</b> rows read · <span class="${err ? 'bad' : ''}">${err} with errors</span> · <span class="${dup ? 'warnc' : ''}">${dup} duplicate mobile</span> · <b>${ok}</b> ready to import`;
    el.querySelector('#imp-go').textContent = `Import ${ok} member${ok === 1 ? '' : 's'}`; el.querySelector('#imp-go').disabled = ok === 0;
  }
  async function startImport(el, file) {
    const C = await H.load();
    let rows;
    try {
      if (/\.xlsx$/i.test(file.name)) rows = await GC.readXLSX(await file.arrayBuffer());
      else if (/\.xls$/i.test(file.name)) throw new Error('Old .xls files are not supported. In Excel choose File → Save As → “Excel Workbook (.xlsx)” or “CSV”, then import that file.');
      else rows = GC.parseCSV(await file.text());
    } catch (e) { return UI.alert('Could not read the file', esc(e.message)); }
    if (rows.length < 2) return UI.alert('Nothing to import', 'The file has no data rows. Please use the template from this page.');
    const { records, missing } = GC.rowsToImport(rows);
    if (missing.length) { await UI.alert('Columns not recognised', `These columns could not be found: <b>${esc(missing.join(', '))}</b>.<br>Please download the template and copy your data into it. You can still continue, but those fields will be empty.`); }
    IMP = { mode: 'skip', rows: records.map(f => ({ f, inc: true })), S: C.S, existing: C.members, today: C.today };
    IMP.rows.forEach((r, i) => revalidate(i, C.S, C.members, C.today));
    const box = el.querySelector('#imp-box');
    box.innerHTML = `<h3>Review &amp; correct (${esc(file.name)})</h3>
      <p class="small muted">Fix any red problems directly in the table – each row is re-checked as you type. Rows with errors are not imported. Dates may be typed as DD-MM-YYYY.</p>
      <div id="imp-sum" class="sum"></div>
      <div class="btn-row"><label>If a mobile number already exists: <select id="imp-mode" class="inp sm-sel"><option value="skip">Skip those rows</option><option value="update">Update the existing member</option><option value="add">Import as a new member anyway</option></select></label>
        <button class="btn sm" id="imp-only">Show problem rows only</button><button class="btn sm ghost" id="imp-all">Show all</button></div>
      <div class="tbl-wrap"><table class="tbl imp"><thead><tr><th></th><th>#</th><th>Name</th><th>Mobile</th><th>Date of birth</th><th>Status</th><th>Date of death</th><th>Groups</th><th>Problems</th></tr></thead><tbody>${IMP.rows.map(importRowHTML).join('')}</tbody></table></div>
      <div class="btn-row"><button class="btn primary" id="imp-go">Import</button><button class="btn ghost" id="imp-cancel">Cancel</button></div>`;
    importSummary(box);
    box.scrollIntoView({ behavior: 'smooth', block: 'start' });
    const upd = tr => {
      const i = +tr.dataset.i, r = IMP.rows[i]; revalidate(i, C.S, C.members, C.today);
      tr.className = r.res.errors.length ? 'bad' : r.dup ? 'dup' : ''; tr.querySelector('.iss').innerHTML = issues(r);
      // a changed row can alter duplicate status of later rows
      box.querySelectorAll('tbody tr').forEach(t2 => { const k = +t2.dataset.i; if (k > i) { const prev = !!IMP.rows[k].dup; revalidate(k, C.S, C.members, C.today); if (prev !== !!IMP.rows[k].dup) { t2.className = IMP.rows[k].res.errors.length ? 'bad' : IMP.rows[k].dup ? 'dup' : ''; t2.querySelector('.iss').innerHTML = issues(IMP.rows[k]); } } });
      importSummary(box);
    };
    box.querySelector('tbody').addEventListener('input', e => { const f = e.target.dataset.f; if (!f) return; const tr = e.target.closest('tr'); IMP.rows[+tr.dataset.i].f[f] = e.target.value; upd(tr); });
    box.querySelector('tbody').addEventListener('change', e => { if (e.target.dataset.inc !== undefined) { IMP.rows[+e.target.closest('tr').dataset.i].inc = e.target.checked; importSummary(box); } });
    box.querySelector('#imp-mode').onchange = e => { IMP.mode = e.target.value; importSummary(box); };
    box.querySelector('#imp-only').onclick = () => box.querySelectorAll('tbody tr').forEach(t => t.hidden = !(t.classList.contains('bad') || t.classList.contains('dup')));
    box.querySelector('#imp-all').onclick = () => box.querySelectorAll('tbody tr').forEach(t => t.hidden = false);
    box.querySelector('#imp-cancel').onclick = () => { IMP = null; box.innerHTML = ''; };
    box.querySelector('#imp-go').onclick = async () => {
      let added = 0, updated = 0, skipped = 0; const toPut = []; const byId = new Map(C.members.map(m => [m.id, m]));
      const sg = new Set(C.S.groups || []);
      for (const r of IMP.rows) {
        if (!r.inc || r.res.errors.length) { skipped++; continue; }
        const m = r.res.member; m.groups.forEach(g => sg.add(g));
        if (r.dup && IMP.mode === 'skip') { skipped++; continue; }
        if (r.dup && IMP.mode === 'update') {
          if (r.dup.where !== 'database') { skipped++; continue; }
          const ex = byId.get(r.dup.id); if (!ex) { skipped++; continue; }
          ['name', 'title', 'gender', 'whatsapp', 'dob', 'email', 'address', 'profession', 'intro', 'remarks', 'bio', 'familyName', 'familyContact'].forEach(k => { if (m[k]) ex[k] = m[k]; });
          ex.status = m.status; ex.dod = m.dod; ex.showPhone = m.showPhone || ex.showPhone; ex.groups = [...new Set([...(ex.groups || []), ...m.groups])]; ex.updatedAt = new Date().toISOString();
          toPut.push(ex); updated++; continue;
        }
        toPut.push(m); added++;
      }
      await GC.db.putMany('members', toPut); await GC.setSetting('groups', [...sg]);
      IMP = null; box.innerHTML = '';
      await UI.alert('Import complete', `✅ <b>${added}</b> added · <b>${updated}</b> updated · <b>${skipped}</b> skipped.`);
      V.data(el);
    };
  }

  /* ================= BACKUP ================= */
  async function buildBackup() {
    const settings = (await GC.db.all('settings')).filter(r => !['pinHash', 'pinSalt'].includes(r.key));
    const data = { members: await GC.db.all('members'), messageLog: await GC.db.all('messageLog'), reminderHistory: await GC.db.all('reminderHistory'),
      customMessages: await GC.db.all('customMessages'), settings };
    // version 2 adds an integrity checksum (SHA-256 of the data) and record counts; version 1 files (no checksum) still restore.
    return { app: 'GroupConnect', version: 2, appVersion: GC.VERSION, exportedAt: new Date().toISOString(),
      counts: { members: data.members.length, messageLog: data.messageLog.length, reminderHistory: data.reminderHistory.length, customMessages: data.customMessages.length },
      checksum: await sha256(JSON.stringify(data)), data };
  }
  async function sha256(text) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  /* Checks a parsed backup before anything is touched. Returns a list of plain-English problems (empty = fine). */
  async function checkBackup(bk) {
    const bad = [], d = bk && bk.data;
    if (!bk || bk.app !== 'GroupConnect' || !d || !Array.isArray(d.members)) return ['This file is not a Group Connect backup.'];
    if (bk.version > 2) bad.push('This backup was made by a newer version of the app (version ' + bk.version + '). Please update the app first.');
    for (const k of ['messageLog', 'reminderHistory', 'customMessages']) if (d[k] != null && !Array.isArray(d[k])) bad.push('The "' + k + '" section is damaged.');
    const ids = new Set();
    d.members.forEach((m, i) => { if (!m || typeof m !== 'object' || !m.id || typeof m.name !== 'string') bad.push('Member record ' + (i + 1) + ' is damaged.'); else if (ids.has(m.id)) bad.push('Member record ' + (i + 1) + ' repeats an earlier ID.'); else ids.add(m.id); });
    (d.messageLog || []).forEach((r, i) => { if (!r || !r.id) bad.push('Message-history record ' + (i + 1) + ' is damaged.'); });
    (d.reminderHistory || []).forEach((r, i) => { if (!r || !r.key) bad.push('Reminder-history record ' + (i + 1) + ' is damaged.'); });
    if (bk.checksum && bk.checksum !== await sha256(JSON.stringify(d))) bad.push('The file has been changed or damaged since it was saved (integrity check failed).');
    return bad.slice(0, 6);
  }
  async function applyBackup(bk, mode) {
    const d = bk.data, problems = await checkBackup(bk);
    if (problems.length) throw new Error(problems.join(' '));
    const keep = (d.settings || []).filter(r => !['pinHash', 'pinSalt'].includes(r.key));
    const puts = { members: d.members, messageLog: d.messageLog || [], reminderHistory: d.reminderHistory || [], customMessages: d.customMessages || [] };
    if (mode === 'replace') puts.settings = keep;   // the PIN stays as it is on this device
    else {   // merge: union the group list, keep this device's other settings
      const cur = await GC.getSettings(); const g = keep.find(r => r.key === 'groups');
      if (g) puts.settings = [{ key: 'groups', value: [...new Set([...(cur.groups || []), ...g.value])] }];
    }
    // one transaction: either everything is restored or nothing changes
    await GC.db.atomic(mode === 'replace' ? ['members', 'messageLog', 'reminderHistory', 'customMessages'] : [], puts);
    return d.members.length;
  }

        }
        const probs = await checkBackup(obj); if (probs.length) throw new Error(probs.join(' '));
        const mode = await new Promise(res => UI.modal({

/* ==== reports.js ==== */
/* Group Connect – Reports (printable, exportable to CSV). */
(function (root) {
  'use strict';
  const GC = root.GC, UI = GC.ui, esc = UI.esc, V = GC.views;
  const KINDS = [['summary', '📊 Summary'], ['groups', '👥 Group-wise members'], ['bmonth', '🎂 Month-wise birthdays'], ['rmonth', '🕯️ Month-wise remembrance dates'],
    ['upcoming', '⏳ Upcoming occasions (next 60 days)'], ['history', '🗒 Message history'], ['confirmed', '✅ Messages confirmed as sent'], ['pending', '⏱ Messages pending action']];
  let kind = 'summary';

  /* Each builder returns { head:[...], rows:[[...]] } – plain text, escaped when drawn. */
  const B = {
    summary(c) {
      const l = c.members.filter(m => m.status === 'living').length, d = c.members.length - l;
      const conf = c.logs.filter(r => r.status === 'confirmed').length;
      return { head: ['Item', 'Count'], rows: [['Total members', c.members.length], ['Living members', l], ['Deceased members (in memory)', d], ['WhatsApp groups', c.S.groups.length],
        ['Messages prepared / handled', c.logs.length], ['Messages confirmed as sent', conf], ['Messages pending action', c.logs.length - conf - c.logs.filter(r => r.status === 'skipped').length]] };
    },
    groups(c) {
      const rows = []; const names = [...new Set([...(c.S.groups || []), ...c.members.flatMap(m => m.groups || [])])].sort();
      for (const g of names) { const ms = c.members.filter(m => (m.groups || []).includes(g)); rows.push([g, ms.length, ms.filter(m => m.status === 'living').length, ms.filter(m => m.status === 'deceased').length, ms.map(m => m.name).sort().join(', ')]); }
      const none = c.members.filter(m => !(m.groups || []).length); if (none.length) rows.push(['(no group)', none.length, none.filter(m => m.status === 'living').length, none.filter(m => m.status === 'deceased').length, none.map(m => m.name).join(', ')]);
      return { head: ['Group', 'Members', 'Living', 'Deceased', 'Names'], rows };
    },
    bmonth(c) { return monthly(c, o => o.type === 'birthday', 'Birthday'); },
    rmonth(c) { return monthly(c, o => o.type !== 'birthday', 'Occasion'); },
    upcoming(c) {
      return { head: ['Date', 'Occasion', 'Name', 'Groups'], rows: GC.upcoming(c.members, c.today, 60).map(o => [GC.fmtDate(o.date), GC.OCC[o.type].label, GC.nameH(o.member), (o.member.groups || []).join(', ')]) };
    },
    history: c => logTable(c, () => true),
    confirmed: c => logTable(c, r => r.status === 'confirmed'),
    pending: c => logTable(c, r => ['prepared', 'copied', 'opened'].includes(r.status))
  };
  function monthly(c, pick, label) {
    const rows = [];
    for (let mo = 1; mo <= 12; mo++) {
      const list = [];
      for (const m of c.members) for (const o of GC.occasionsOf(m)) if (o.m === mo && pick(o)) list.push({ d: o.d, m, o });
      list.sort((a, b) => a.d - b.d || (a.m.name || '').localeCompare(b.m.name || ''));
      list.forEach(x => rows.push([GC.MONTHS[mo - 1], x.d, x.o.type === 'birthday' ? label : GC.OCC[x.o.type].label, GC.nameH(x.m), (x.m.groups || []).join(', ')]));
    }
    return { head: ['Month', 'Day', 'Occasion', 'Name', 'Groups'], rows };
  }
  function logTable(c, f) {
    const byId = new Map(c.members.map(m => [m.id, m]));
    const rows = c.logs.filter(f).sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || '')).map(r => {
      const m = byId.get(r.memberId);
      return [UI.fmtDT(r.updatedAt, c.S.tz), m ? GC.nameH(m) : '(member deleted)', GC.OCC[r.occasion] ? GC.OCC[r.occasion].label : r.occasion, GC.fmtDate(r.occDate), r.channel === 'group' ? 'Group: ' + (r.group || '') : 'Personal', (UI.STATUS_LABEL[r.status] || r.status).replace(/^\S+\s/, '')];
    });
    return { head: ['Updated', 'Name', 'Occasion', 'Occasion date', 'Channel', 'Status'], rows };
  }

  V.reports = async el => {
    const S = await GC.getSettings();
    const c = { S, members: await GC.db.all('members'), logs: await GC.db.all('messageLog'), today: GC.nowParts(S.tz).date };
    const rep = B[kind](c);
    el.innerHTML = `<div class="page-head"><h1>📈 Reports</h1></div>
      <div class="card noprint"><div class="fgrid"><label>Report<select id="rp-kind" class="inp">${KINDS.map(([k, l]) => `<option value="${k}" ${k === kind ? 'selected' : ''}>${l}</option>`).join('')}</select></label></div>
        <div class="btn-row"><button class="btn" id="rp-print">🖨 Print / save as PDF</button><button class="btn" id="rp-csv">⬇ Download CSV</button></div></div>
      <div class="card"><h2>${esc(KINDS.find(k => k[0] === kind)[1])}</h2><p class="small muted">${esc(GC.fmtDate(c.today))} · ${rep.rows.length} row${rep.rows.length === 1 ? '' : 's'}${kind === 'groups' || kind === 'upcoming' ? '' : ''}</p>
        ${rep.rows.length ? `<div class="tblwrap"><table class="tbl"><tr>${rep.head.map(h => `<th>${esc(h)}</th>`).join('')}</tr>${rep.rows.map(r => `<tr>${r.map(x => `<td>${esc(String(x))}</td>`).join('')}</tr>`).join('')}</table></div>` : '<p class="muted">Nothing to show for this report yet.</p>'}
        <p class="small muted">Mobile numbers of deceased members are never included in reports.</p></div>`;
    el.querySelector('#rp-kind').onchange = e => { kind = e.target.value; V.reports(el); };
    el.querySelector('#rp-print').onclick = () => root.print();
    el.querySelector('#rp-csv').onclick = () => GC.download(`GroupConnect-report-${kind}-${c.today}.csv`, GC.toCSV([rep.head, ...rep.rows.map(r => r.map(String))]), 'text/csv');
  };
})(typeof self !== 'undefined' ? self : this);

      if (reg && reg.active) await reg.showNotification(title, opts); else new Notification(title, opts);
      return true;
    } catch (e) { console.warn('notify failed', e); return false; }
  };
  GC.enableNotifications = async function () {
    if (!('Notification' in root)) { UI.toast('This browser does not support notifications. On iPhone, add the app to your Home Screen first.', 'err'); return false; }
    let p = Notification.permission; if (p === 'default') p = await Notification.requestPermission();
    if (p !== 'granted') { await GC.setSetting('notifEnabled', false); UI.toast('Notification permission was not granted. You can allow it in the browser/site settings.', 'err'); return false; }
    await GC.setSetting('notifEnabled', true);
    try { const reg = await navigator.serviceWorker.getRegistration(); if (GC.BG_SYNC && reg && reg.periodicSync) await reg.periodicSync.register('gc-daily', { minInterval: 6 * 3600 * 1000 }); } catch (e) { /* not supported / not allowed */ }
    UI.toast('Reminders enabled 🔔', 'ok'); GC.checkReminders(); return true;
  };
  GC.checkReminders = async function () {
    try { const r = await GC.runReminders({ notify: GC.notifyApp }); if (r && r.shown) root.dispatchEvent(new Event('gc-data-changed')); } catch (e) { console.warn(e); }
  };

  /* ---------- background loops ---------- */
  let loopT = 0;
  function startLoops() {
    clearInterval(loopT);
    GC.checkReminders(); GC.resetIdle();
    loopT = setInterval(async () => {
      if (locked) return;
      GC.checkReminders();
      const S = await GC.getSettings(); const d = GC.nowParts(S.tz).date;
      if (lastRenderDate && d !== lastRenderDate && /^(#\/?(dashboard|today)?)?$/.test(location.hash) && !document.querySelector('.overlay')) GC.router();
    }, 60000);
  }
  document.addEventListener('visibilitychange', async () => {
    if (document.hidden) { hiddenAt = Date.now(); return; }
    if (locked || !bootDone) return;
    const S = await GC.getSettings();
    if (S.pinHash && S.autoLockMin && hiddenAt && Date.now() - hiddenAt > S.autoLockMin * 60000) return GC.lock();
    GC.checkReminders();
    if (lastRenderDate && GC.nowParts(S.tz).date !== lastRenderDate && !document.querySelector('.overlay')) GC.router();
  });

  function start() { GC.router(); startLoops(); }

  /* ---------- service worker & install ---------- */
  function registerSW() {
    if (!('serviceWorker' in navigator) || !(location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) return;
    navigator.serviceWorker.register('service-worker.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing; if (!nw) return;
        nw.addEventListener('statechange', () => { if (nw.state === 'installed' && navigator.serviceWorker.controller) UI.toast('A new version is ready – reload the page to use it'); });
      });
    }).catch(e => console.warn('SW registration failed', e));
  }
  let deferredInstall = null;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; const b = document.getElementById('install'); if (b) b.hidden = false; });
  window.addEventListener('appinstalled', () => { const b = document.getElementById('install'); if (b) b.hidden = true; UI.toast('App installed 🎉', 'ok'); });

  /* ---------- boot ---------- */
  async function boot() {
    document.getElementById('lock-form').addEventListener('submit', e => { e.preventDefault(); tryUnlock(); });
    document.getElementById('btn-lock').onclick = async () => { const S = await GC.getSettings(); if (S.pinHash) GC.lock(); else UI.toast('Set a PIN in Settings first to use the lock'); };
    document.getElementById('install').onclick = async () => { if (deferredInstall) { deferredInstall.prompt(); deferredInstall = null; document.getElementById('install').hidden = true; } };
    try { await GC.openDB(); } catch (e) {
      main().innerHTML = `<div class="card"><h2>Storage unavailable</h2><p class="bad">${UI.esc(e.message)}</p><p>Group Connect keeps its data in your browser's local database (IndexedDB). Private/incognito windows or strict privacy settings can block it. Please open the app in a normal browser window.</p></div>`; return;
    }
    registerSW();
    const S = await GC.getSettings();
    bootDone = true;
    if (S.pinHash) GC.lock(); else start();
  }
  document.addEventListener('DOMContentLoaded', boot);
})(typeof self !== 'undefined' ? self : this);
